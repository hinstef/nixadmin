[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nixadmin"
version = "0.1.0"
description = "Ambient system intelligence daemon for NixOS"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Steffen" }]

# Runtime deps. protocol.py / sdk.py / cli.py are stdlib-only by discipline so a
# future client/sdk split needs no code change — only the daemon needs the heavy
# packages below.
dependencies = [
    "httpx>=0.27",       # async HTTP for the local (Ollama) chain
    "litellm>=1.86",     # remote provider abstraction (Hermes, APIs, OpenRouter…)
    "dbus-fast>=4.0",    # async D-Bus for monitors
    "structlog>=24",     # structured logging with per-query contextvars binding
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
nixadmin = "nixadmin.cli:main"
nixadmin-daemon = "nixadmin.server:main"
nixadmin-tray = "nixadmin.tray.main:main"
nixadmin-web = "nixadmin.web.server:main"
nixadmin-overlay = "nixadmin.overlay:main"

# Third-party modules register here. Built-in modules are loaded directly (not
# via entry points) and always take precedence.
[project.entry-points."nixadmin.modules"]
# example = "nixadmin_example:MODULE"

[tool.hatch.build.targets.wheel]
packages = ["src/nixadmin"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# sni.py uses literal string annotations (``-> 's'``) as D-Bus type signatures,
# not Python types: they must stay quoted (UP037) and read as "undefined names"
# to a linter that treats them as forward refs (F821).
"src/nixadmin/tray/sni.py" = ["UP037", "F821", "F722"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

# The D-Bus interface classes annotate methods with D-Bus signatures, not Python
# types (``-> 's'``), which mypy can't and shouldn't check. The rest of the tray
# (client, icons, main) stays under strict.
[[tool.mypy.overrides]]
module = "nixadmin.tray.sni"
ignore_errors = true

# PyGObject exposes GTK/WebKit/layer-shell dynamically through GI typelibs; no
# complete Python stubs exist for mypy to check. The pure URL/config surface is
# still tested without importing GI, and the packaged wrapper is integration-tested.
[[tool.mypy.overrides]]
module = "nixadmin.overlay"
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "contrib/nixadmin-extras/src"]
